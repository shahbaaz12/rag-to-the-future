  <div class="hybrid-search-visual__question">
    <span class="hybrid-search-visual__label">The user's question</span>

      <p>Uses the exact code: <strong>“E922.”</strong></p>
      <p class="hybrid-search-visual__benefit">Helps find the instructions for that particular error code.</p>
      <div class="hybrid-search-visual__match hybrid-search-visual__match--shared"><span>Possible shared match · exact code</span><p>“E922: Brush jam detected.”</p></div>
