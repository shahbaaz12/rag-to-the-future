<figure class="rag-flow" aria-labelledby="rag-flow-title">
  <figcaption id="rag-flow-title">From documents to an answer</figcaption>
  <div class="rag-flow__phases">
    <section aria-labelledby="rag-prepare-title">
      <h4 id="rag-prepare-title">A · Prepare the documents</h4>
      <p class="rag-flow__timing">Before questions arrive</p>
      <ol class="rag-flow__steps">
        <li><span class="rag-flow__number">1</span><div><strong>Load documents</strong><p>Read the notes or files we want to search.</p><small>Input: our course notes</small></div></li>
        <li><span class="rag-flow__number">2</span><div><strong>Split into chunks</strong><p>Break long documents into smaller pieces of text.</p><small>Short notes can stay in one piece.</small></div></li>
        <li><span class="rag-flow__number">3</span><div><strong>Create chunk vectors</strong><p>The embedding model turns each chunk into a list of numbers.</p><small>One chunk → one vector</small></div></li>
        <li><span class="rag-flow__number">4</span><div><strong>Save in the vector store</strong><p>Keep each vector with its original chunk and source details.</p><small>Saved together: vector + text + source</small></div></li>
      </ol>
    </section>
    <section aria-labelledby="rag-answer-title">
      <h4 id="rag-answer-title">B · Answer a question</h4>
      <p class="rag-flow__timing">Repeat for each question that needs retrieval</p>
      <ol class="rag-flow__steps" start="5">
        <li><span class="rag-flow__number">5</span><div><strong>Create the question vector</strong><p>Embed the whole question with the same embedding model.</p><small>“What does RAG do?” → one vector</small></div></li>
        <li><span class="rag-flow__number">6</span><div><strong>Search the saved vectors</strong><p>Compare the question vector with the chunk vectors saved in Step 4.</p><small>Look for similar vectors.</small></div></li>
        <li><span class="rag-flow__number">7</span><div><strong>Retrieve the matching text</strong><p>Return the selected chunks' original text and source details.</p><small>Example text: “RAG retrieves relevant documents…”</small></div></li>
        <li><span class="rag-flow__number">8</span><div><strong>Build the prompt</strong><p>Combine the original question, retrieved text, and answer instructions.</p><small>The chat model receives text.</small></div></li>
        <li><span class="rag-flow__number">9</span><div><strong>Write the answer</strong><p>The chat model reads the prompt and answers using the supplied text.</p><small>Example: “RAG finds useful text before generating an answer.”</small></div></li>
      </ol>
    </section>
  </div>
</figure>
